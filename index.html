<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>DDS SEGURO</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1f3a; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .push-bar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 9999;
      background: #0b1f3a; color: #fff; border: 1px solid rgba(255,255,255,.25);
      border-radius: 14px; padding: 10px 14px; display: none; align-items: center; gap: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,.35); font-family: system-ui, sans-serif; font-size: 13.5px;
      max-width: 92vw;
    }
    .push-bar button {
      background: #10b981; color: #fff; border: 0; border-radius: 9px; padding: 7px 12px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="push-bar" id="pushBar">
  <span>🔔 Ative os alertas do <b>DDS SEGURO</b> para receber novos DDS e avisos!</span>
  <button onclick="ativarNotificacoes()">Ativar</button>
</div>

<iframe id="appFrame"></iframe>

<script>
  // URL do seu Google Apps Script
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFZ4AIkXNPZ-CUOe8i-RzrY17hC-WvIQZ6htOTbXd9jc84bawDbe1sF8WFsky-74as_w/exec";

  // App ID do OneSignal
  const ONESIGNAL_APP_ID = "3da15322-a3bf-419d-b2dc-b1f3f916e97b";

  const params = window.location.search || "?modo=colab";
  document.getElementById("appFrame").src = APPS_SCRIPT_URL + params;

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      notifyButton: { enable: false }
    });

    if (!OneSignal.Notifications.permission) {
      document.getElementById("pushBar").style.display = "flex";
    }

    window.addEventListener("message", async (ev) => {
      if (ev.data && ev.data.tipo === "VINCULAR_PUSH") {
        const subId = OneSignal.User.PushSubscription.id;
        if (subId) {
          OneSignal.User.addTags({
            matricula: String(ev.data.matricula || ""),
            empresa_id: String(ev.data.empresa_id || "todas"),
            cliente_id: String(ev.data.cliente_id || "todos")
          });
          document.getElementById("appFrame").contentWindow.postMessage({
            tipo: "SALVAR_PUSH_ID",
            matricula: ev.data.matricula,
            pushId: subId
          }, "*");
        }
      }
    });
  });

  async function ativarNotificacoes() {
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.Notifications.requestPermission();
      document.getElementById("pushBar").style.display = "none";
    });
  }
</script>
</body>
</html>
