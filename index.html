<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DDS SEGURO">
  <title>DDS SEGURO</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1b4CVOUP_qTrJKeuIxGlMfynjLYDIcp76">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1b4CVOUP_qTrJKeuIxGlMfynjLYDIcp76">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000000;
      overscroll-behavior: none;
    }
    .frame-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f4f5;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .floating-bar {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 99999;
      background: #000000; color: #fff; border: 1px solid rgba(250,204,21,.45);
      border-radius: 14px; padding: 12px 14px; display: none; align-items: center; gap: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,.5); font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
      width: 92vw; max-width: 440px; justify-content: space-between;
    }
    #pushBar { top: calc(12px + env(safe-area-inset-top, 0px)); }
    #installBar { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); background: #18181b; border-color: #FACC15; }
    .floating-bar button.acao {
      background: #FACC15; color: #000000; border: 0; border-radius: 9px; padding: 9px 14px;
      font-weight: 800; cursor: pointer; white-space: nowrap; font-size: 13px; flex-shrink: 0;
    }
    .floating-bar button.acao:disabled { opacity: 0.6; }
    .floating-bar button.fechar {
      background: transparent; color: rgba(255,255,255,.75); border: 0; font-size: 17px; cursor: pointer; padding: 2px 6px;
    }
  </style>
</head>
<body>

<div class="floating-bar" id="pushBar">
  <span id="pushTxt">🔔 Ative os alertas do <b>DDS SEGURO</b> para receber DDS e avisos!</span>
  <div style="display:flex;align-items:center;gap:4px">
    <button class="acao" id="btnPush" onclick="ativarNotificacoes()">Ativar</button>
    <button class="fechar" onclick="document.getElementById('pushBar').style.display='none'">✕</button>
  </div>
</div>

<div class="floating-bar" id="installBar">
  <span id="installTxt">📲 Instale o app <b>DDS SEGURO</b> no seu celular!</span>
  <div style="display:flex;align-items:center;gap:4px">
    <button class="acao" id="btnInstall" onclick="instalarApp()">Instalar</button>
    <button class="fechar" onclick="document.getElementById('installBar').style.display='none'">✕</button>
  </div>
</div>

<div class="frame-wrap">
  <iframe id="appFrame" allow="clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFZ4AIkXNPZ-CUOe8i-RzrY17hC-WvIQZ6htOTbXd9jc84bawDbe1sF8WFsky-74as_w/exec";
  const ONESIGNAL_APP_ID = "3da15322-a3bf-419d-b2dc-b1f3f916e97b";

  const BASE_PATH = window.location.pathname.replace(/\/[^\/]*$/, "/");
  const SW_PATH = BASE_PATH + "OneSignalSDKWorker.js";

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register(SW_PATH, { scope: BASE_PATH }).catch(() => {});
  }

  const frameEl = document.getElementById("appFrame");
  const rawSearch = window.location.search;
  const params = rawSearch
    ? (rawSearch.includes("modo=") || rawSearch.includes("dds=") || rawSearch.includes("aba=") ? rawSearch : rawSearch + "&modo=colab")
    : "?modo=colab";
  frameEl.src = APPS_SCRIPT_URL + params;

  let oneSignalInstancia = null;
  let ultimoColab = null;
  let deferredPrompt = null;

  try {
    const salvo = localStorage.getItem("dds_pwa_colab");
    if (salvo) ultimoColab = JSON.parse(salvo);
  } catch (e) {}

  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) {
      document.getElementById("installBar").style.display = "flex";
    }
  });

  if (isIOS && !isStandalone) {
    document.getElementById("installTxt").innerHTML = '📲 No iPhone: toque em <b>Compartilhar</b> e <b>Adicionar à Tela de Início</b>.';
    document.getElementById("btnInstall").style.display = "none";
    document.getElementById("installBar").style.display = "flex";
  }

  async function instalarApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === "accepted") {
      document.getElementById("installBar").style.display = "none";
    }
    deferredPrompt = null;
  }

  let tentativasSync = 0;
  function sincronizarPushComPlanilha() {
    if (!oneSignalInstancia || !ultimoColab || !ultimoColab.matricula) return;
    const subId = oneSignalInstancia.User?.PushSubscription?.id;
    if (!subId) {
      // O ID do aparelho pode demorar alguns segundos para existir logo após ativar
      if (tentativasSync < 8) { tentativasSync++; setTimeout(sincronizarPushComPlanilha, 1500); }
      return;
    }
    tentativasSync = 0;
    try { oneSignalInstancia.login(String(ultimoColab.matricula)); } catch (e) {}
    try {
      oneSignalInstancia.User.addTags({
        matricula: String(ultimoColab.matricula || ""),
        empresa_id: String(ultimoColab.empresa_id || "todas"),
        cliente_id: String(ultimoColab.cliente_id || "todos")
      });
    } catch (e) {}
    // Caminho principal: grava o ID do aparelho na planilha direto pelo servidor
    fetch(APPS_SCRIPT_URL + "?action=vincularPush&mat=" + encodeURIComponent(ultimoColab.matricula) + "&pid=" + encodeURIComponent(subId), { mode: "no-cors" }).catch(() => {});
    try {
      frameEl.contentWindow?.postMessage({
        tipo: "SALVAR_PUSH_ID",
        matricula: ultimoColab.matricula,
        pushId: subId
      }, "*");
    } catch (e) {}
  }

  function mostrarBloqueado() {
    const txt = document.getElementById("pushTxt");
    const btn = document.getElementById("btnPush");
    txt.innerHTML = '⚠️ Notificações bloqueadas. Abra <b>Configurações do celular → Apps → DDS SEGURO → Notificações</b> e ative (no navegador: cadeado → <b>Permissões → Notificações → Permitir</b>).';
    btn.style.display = "";
    btn.disabled = false;
    btn.textContent = "Já liberei";
    document.getElementById("pushBar").style.display = "flex";
  }

  async function revalidarPush() {
    if (!oneSignalInstancia) return;
    try {
      const perm = ("Notification" in window) ? Notification.permission : "default";
      if (perm === "granted") {
        if (!oneSignalInstancia.User.PushSubscription.optedIn) {
          await oneSignalInstancia.User.PushSubscription.optIn();
        }
        document.getElementById("pushBar").style.display = "none";
        sincronizarPushComPlanilha();
      } else if (perm === "denied") {
        mostrarBloqueado();
      }
    } catch (e) {}
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { revalidarPush(); sincronizarPushComPlanilha(); }
  });
  window.addEventListener("focus", () => { revalidarPush(); });

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: SW_PATH,
        serviceWorkerParam: { scope: BASE_PATH }
      });
      oneSignalInstancia = OneSignal;

      const jaAtivo = OneSignal.Notifications.permission === true && OneSignal.User.PushSubscription.optedIn;
      if (jaAtivo) {
        document.getElementById("pushBar").style.display = "none";
        sincronizarPushComPlanilha();
      } else if ("Notification" in window && Notification.permission === "granted") {
        revalidarPush();
      } else if ("Notification" in window && Notification.permission === "denied" && !(isIOS && !isStandalone)) {
        mostrarBloqueado();
      } else if (!(isIOS && !isStandalone)) {
        document.getElementById("pushBar").style.display = "flex";
      }

      OneSignal.User.PushSubscription.addEventListener("change", (ev) => {
        if (ev.current && ev.current.optedIn) {
          document.getElementById("pushBar").style.display = "none";
          sincronizarPushComPlanilha();
        }
      });
    } catch (err) {
      console.error("OneSignal init:", err);
      if (!(isIOS && !isStandalone)) {
        document.getElementById("pushBar").style.display = "flex";
      }
    }
  });

  window.addEventListener("message", (ev) => {
    if (!ev.data) return;
    if (ev.data.tipo === "VINCULAR_PUSH") {
      ultimoColab = ev.data;
      try { localStorage.setItem("dds_pwa_colab", JSON.stringify(ev.data)); } catch (e) {}
      sincronizarPushComPlanilha();
    }
    if (ev.data.tipo === "DISPARAR_INSTALACAO_PWA" && deferredPrompt) {
      instalarApp();
    }
  });

  async function ativarNotificacoes() {
    const btn = document.getElementById("btnPush");
    const txt = document.getElementById("pushTxt");

    if (isIOS && !isStandalone) {
      txt.innerHTML = '📲 Instale o app primeiro: toque em <b>Compartilhar → Adicionar à Tela de Início</b>.';
      btn.style.display = "none";
      return;
    }

    if ("Notification" in window && Notification.permission === "denied") {
      mostrarBloqueado();
      return;
    }

    btn.disabled = true;
    btn.textContent = "Aguarde...";

    try {
      if (oneSignalInstancia) {
        await oneSignalInstancia.Notifications.requestPermission();
        if ("Notification" in window && Notification.permission === "denied") { mostrarBloqueado(); return; }
        await oneSignalInstancia.User.PushSubscription.optIn();
        tentativasSync = 0;
        sincronizarPushComPlanilha();

        if (oneSignalInstancia.Notifications.permission) {
          txt.innerHTML = "✅ <b>Alertas ativados neste dispositivo!</b>";
          btn.style.display = "none";
          setTimeout(() => { document.getElementById("pushBar").style.display = "none"; }, 2200);
          return;
        }
      }

      if ("Notification" in window) {
        const res = await Notification.requestPermission();
        if (res === "granted") {
          txt.innerHTML = "✅ <b>Alertas ativados neste dispositivo!</b>";
          btn.style.display = "none";
          setTimeout(() => { document.getElementById("pushBar").style.display = "none"; }, 2200);
          return;
        }
      }

      btn.disabled = false;
      btn.textContent = "Ativar";
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Ativar";
      txt.innerHTML = '⚠️ Não foi possível ativar. Verifique as permissões de notificação do navegador.';
    }
  }
</script>
</body>
</html>
